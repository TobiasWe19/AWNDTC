# OPTIONAL experimental Nordic nRF Distance Measurement extension.
# Apply with: -DEXTRA_CONF_FILE=dm.conf
# The baseline RSSI / periodic application runs without this overlay.
CONFIG_BT_SCAN_WITH_IDENTITY=y
CONFIG_BT_ID_MAX=1
CONFIG_BT_PRIVACY=n
CONFIG_DM_MODULE=y
CONFIG_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
CONFIG_DM_HIGH_PRECISION_CALC=n
CONFIG_DM_GPIO_DEBUG=n

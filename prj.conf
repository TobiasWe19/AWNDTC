# Zephyr / Nordic nRF Connect SDK: Bluetooth observer + broadcaster.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="Assistive Wristband"

# Two advertising sets: legacy discovery + extended periodic train.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_PER_ADV=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_PER_ADV_SYNC_MAX=1

# Nordic Zephyr software controller resources (validate on chosen NCS).
CONFIG_BT_CTLR_ADV_SET=2
CONFIG_BT_CTLR_SYNC_PERIODIC=y
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Diagnostics. USB/UART/RTT console routing depends on local Zephyr board setup.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=4096

# Use the Nordic SoftDevice controller for NCS-based multi-role radio scheduling.
CONFIG_BT_LL_SOFTDEVICE=y
